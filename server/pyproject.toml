[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-as-trackpad-server"
version = "0.1.0"
description = "Desktop server for Phone-as-Trackpad"
readme = "PURPOSE.md"
requires-python = ">=3.13"
dependencies = [
  "pyautogui>=0.9.54",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"
